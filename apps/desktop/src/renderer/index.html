<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>FABRIQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { font-family: 'Inter', system-ui, sans-serif; background: #F3F4F6; color: #111827; }
      * { box-sizing: border-box; }
      button {
        background: #FFFFFF; color: #111827; border: 1px solid #D1D5DB;
        border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px;
      }
      button:hover:not(:disabled) { background: #F3F4F6; }
      button:disabled { opacity: 0.5; cursor: default; }
      input[type="text"], input[type="number"], input[type="email"], input[type="password"] {
        background: #FFFFFF; color: #111827; border: 1px solid #D1D5DB;
        border-radius: 6px; padding: 5px 8px; font-size: 13px; width: 100%;
      }
      label {
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px; margin-bottom: 10px; font-size: 13px;
      }
      label input { width: 110px; }
      h4 { margin: 0 0 10px; font-size: 13px; color: #6B7280; text-transform: uppercase; letter-spacing: 0.03em; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .spin { animation: spin 0.9s linear infinite; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
