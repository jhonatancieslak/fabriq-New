name: Desktop — build instalador Windows

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/desktop-build.yml'
    tags:
      - 'desktop-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --filter @fabriq/desktop...

      - name: Build installer (.exe) — sem publicar
        if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
        run: pnpm --filter @fabriq/desktop dist:win:local

      - name: Build + publicar release (auto-update)
        if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter @fabriq/desktop dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabriq-desktop-windows
          path: apps/desktop/release/*.exe
          retention-days: 30
