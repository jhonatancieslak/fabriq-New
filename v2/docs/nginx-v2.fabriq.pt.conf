# FABRIQ v2 — app nova (React/Vite + Supabase), dev
# Desenvolvimento: Jhonatan Cieslak | jhonatan.cieslak94@gmail.com | +351 935 834 214

server {
    server_name v2.fabriq.pt;

    # Auth (GoTrue) — self-host, substitui o auth.v1 do Supabase Cloud
    location /auth/v1/ {
        proxy_pass http://127.0.0.1:9999/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST (PostgREST) — self-host, substitui o rest.v1 do Supabase Cloud
    location /rest/v1/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /var/www/fabriq/v2/app/dist;
    index index.html;

    location /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/v2.fabriq.pt_access.log;
    error_log  /var/log/nginx/v2.fabriq.pt_error.log;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/v2.fabriq.pt/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/v2.fabriq.pt/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = v2.fabriq.pt) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name v2.fabriq.pt;
    return 404; # managed by Certbot


}