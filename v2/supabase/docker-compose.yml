# FABRIQ v2 — stack Supabase self-hosted mínima (sem Kong/Storage/Realtime/Studio)
# Desenvolvimento: Jhonatan Cieslak | jhonatan.cieslak94@gmail.com | +351 935 834 214
# Postgres já roda no host (cluster existente, database fabriq_v2). Aqui só Auth + REST.

services:
  gotrue:
    image: supabase/gotrue:v2.174.0
    container_name: fabriq_v2_auth
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./gotrue.env

  postgrest:
    image: postgrest/postgrest:v12.2.8
    container_name: fabriq_v2_rest
    restart: unless-stopped
    network_mode: host
    env_file:
      - ./postgrest.env
